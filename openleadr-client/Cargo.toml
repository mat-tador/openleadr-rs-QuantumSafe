[package]
name = "openleadr-client"
description = "OpenADR 3.0 client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true
keywords.workspace = true

[dependencies]
# --- Dipendenze dal Workspace (Standard OpenADR) ---
openleadr-wire.workspace = true
rangemap = { workspace = true } 

serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }

tokio = { workspace = true, features = ["full"] }

# --- STACK HTTP (Mantenuto per la logica OpenADR) ---
reqwest = { workspace = true } 

# --- CRITTOGRAFIA & TLS (FORZIAMO LE VERSIONI LOCALI PER RISOLVERE IL LINKING) ---
# *Questo bypassa il problema di risoluzione del workspace che causa l'errore*
openssl = "0.10"
openssl-sys = "0.9" 


# --- Altre Dipendenze dal Workspace (Standard) ---
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
validator = { workspace = true }
mime = { workspace = true }
http-body-util = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
hyper = "1.8.1"
axum.workspace = true
bytes = "1.11.0"
http.workspace = true
p256 = "0.13.2"


[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
serial_test = { workspace = true }
